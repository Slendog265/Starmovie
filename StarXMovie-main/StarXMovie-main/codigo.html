<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Contraseña</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <link href="frontend/css/recuperar contrasena style.css" rel="stylesheet">

</head>

<body>

    <header>

        <div class="container text-center">

            <h1>Recuperar Contraseña</h1>

        </div>

    </header>
    
    <main class="py-5">
        <div class="container">
            <section class="bg-white p-4 rounded shadow-lg" style="max-width: 380px; margin: 0 auto;">
                <h2 class="text-center">Revisa tu Mail</h2>
                <p class="text-center">Ingresa el codigo</p>

                <form action="backend/php/cambiar contrasena.php" method="post">
                    <div class="mb-3">
                        <input |type="text" name="respuesta" id="respuesta" class="form-control"
                            placeholder="Codigo" required>
                    </div>
                    <div class="mb-3">
                        <input |type="password" name="contrasena" id="contrasena" class="form-control"
                            placeholder="Contrasena" required>
                    </div>
                    <div class="mb-3">
                        <input |type="password" name="verificar" id="verificar" class="form-control"
                            placeholder="Verificar Contrasena" required>
                    </div>
                    <div class="text-center">
                        <input type="submit" value="Enviar Codigo" class="btn btn-primary btn-block">
                    </div>
                </form>
                
                <p class="mt-3 text-center">¿Recuerdas tu contraseña? <a href="login.html">Inicia sesión aquí</a></p>
            </section>
        </div>
    </main>
    
    <footer>

        <div class="container text-center">

            <p>&copy; StarMovie</p>

        </div>

    </footer>
    
</body>

</html>
